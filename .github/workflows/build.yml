name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  phone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: protoc + Python packages for the protobuf generator
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler > /dev/null
          pip install protobuf grpcio-tools
      - name: NDK + CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null
      - name: Signing
        run: |
          cat > android/local.properties <<PROPS
          sdk.dir=$ANDROID_HOME
          chiakiKeystore=../inarabic.jks
          chiakiKeystorePW=inarabic123
          chiakiKeyAlias=inarabic
          chiakiKeyPW=inarabic123
          PROPS
      - name: Build phone APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease
      - run: cp android/app/build/outputs/apk/release/*.apk InArabic-phone.apk
      - uses: actions/upload-artifact@v4
        with:
          name: phone
          path: InArabic-phone.apk

  tv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Android TV APK
        working-directory: tv
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon assembleRelease
      - run: cp tv/app/build/outputs/apk/release/*.apk InArabic-androidtv.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tv
          path: InArabic-androidtv.apk

  lg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Package LG IPK
        run: |
          sed -i "s/\"version\": \"0.1.0\"/\"version\": \"0.1.${{ github.run_number }}\"/" lg/appinfo.json
          npm install -g @webos-tools/cli@3.2.1 > /dev/null
          ares-package -n lg -o .
          mv com.inarabic.lg_*.ipk InArabic-lg.ipk
      - name: Homebrew Channel repository (so the TV's developer apps list it and update it)
        run: |
          v=0.1.${{ github.run_number }}
          raw=https://raw.githubusercontent.com/${{ github.repository }}/repo
          sha=$(sha256sum InArabic-lg.ipk | cut -d' ' -f1)
          mkdir -p lgrepo && cp lg/largeIcon.png lgrepo/icon.png
          python3 - "$v" "$raw" "$sha" <<'PY'
          import json, sys
          v, raw, sha = sys.argv[1:]
          m = {"id": "com.inarabic.lg", "version": v, "type": "web", "title": "بالعربي",
               "appDescription": "ترجمة ألعاب البلايستيشن للعربي على الشاشة", "iconUri": raw + "/icon.png",
               "sourceUrl": "https://github.com/ahmad-ksa/In-Arabic", "rootRequired": False,
               "ipkUrl": "https://github.com/ahmad-ksa/In-Arabic/releases/download/latest/InArabic-lg.ipk",
               "ipkHash": {"sha256": sha}}
          json.dump(m, open("lgrepo/com.inarabic.lg.manifest.json", "w"), ensure_ascii=False, indent=2)
          json.dump({"paging": {"page": 1, "count": 1, "maxPage": 1, "itemsTotal": 1},
                     "packages": [{"id": m["id"], "title": m["title"], "iconUri": m["iconUri"],
                                   "manifestUrl": raw + "/com.inarabic.lg.manifest.json", "manifest": m,
                                   "category": "multimedia", "shortDescription": m["appDescription"], "version": v}]},
                    open("lgrepo/apps.json", "w"), ensure_ascii=False, indent=2)
          PY
          cat lgrepo/apps.json
      - name: Package Samsung WGT (same page, Tizen config)
        run: |
          mkdir -p wgt && cp -r lg/index.html lg/qrcode.js lg/fonts lg/pattern.png lg/largeIcon.png samsung/config.xml wgt/
          sed -i "s/version=\"0.1.0\"/version=\"0.1.${{ github.run_number }}\"/" wgt/config.xml
          (cd wgt && zip -qr ../InArabic-samsung.wgt .)
      - uses: actions/upload-artifact@v4
        with:
          name: lg
          path: |
            InArabic-lg.ipk
            InArabic-samsung.wgt
            lgrepo

  release:
    needs: [phone, tv, lg]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: phone }
      - uses: actions/download-artifact@v4
        with: { name: tv }
      - uses: actions/download-artifact@v4
        with: { name: lg }
      - name: Check the files are all here
        run: ls -la && for f in InArabic-phone.apk InArabic-androidtv.apk InArabic-lg.ipk InArabic-samsung.wgt; do test -s $f || { echo "::error::$f missing"; exit 1; }; done
      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="بالعربي — آخر إصدار (0.1.${{ github.run_number }})"
          notes="InArabic-phone.apk للجوال • InArabic-androidtv.apk لشاشة أندرويد • InArabic-lg.ipk لشاشة LG • InArabic-samsung.wgt لشاشة سامسونج"
          files="InArabic-phone.apk InArabic-androidtv.apk InArabic-lg.ipk InArabic-samsung.wgt"
          # replace the files in place (deleting the release has been failing with HTTP 500 on GitHub's side)
          if gh release view latest > /dev/null 2>&1; then
            ok=0; for i in 1 2 3; do gh release upload latest $files --clobber && { ok=1; break; }; sleep 10; done; test $ok = 1
            gh release edit latest --title "$title" --notes "$notes"
          else
            gh release create latest $files --title "$title" --notes "$notes"
          fi
      - name: Publish the Homebrew Channel repository (branch "repo")
        run: |
          cd lgrepo
          git init -q -b repo
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -qm "repo ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" repo

  smoke:
    needs: [phone]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: phone
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Start the app on an emulator and capture crashes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r InArabic-phone.apk
            adb logcat -c
            adb shell monkey -p com.inarabic.phone -c android.intent.category.LAUNCHER 1
            sleep 15
            adb logcat -d -b crash > crash.txt || true
            adb logcat -d | grep -E "AndroidRuntime|FATAL|InArabic|chiaki" > app.txt || true
            adb shell pidof com.inarabic.phone && echo "APP STILL RUNNING" || echo "APP NOT RUNNING"
            adb exec-out screencap -p > screen.png
            echo "===== crash buffer"; cat crash.txt | head -80
            if [ -s crash.txt ]; then echo "::error::the app crashed"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke
          path: |
            crash.txt
            app.txt
            screen.png

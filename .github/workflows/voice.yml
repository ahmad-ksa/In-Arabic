name: voice
on:
  push:
    branches: [voice-run]
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -U edge-tts
      - name: Arabic narration
        run: |
          mkdir -p voice
          while IFS='|' read -r n t; do
            [ -z "$n" ] && continue
            edge-tts --voice ar-SA-HamedNeural --rate=+10% --text "$t" --write-media voice/$n.mp3
          done < ci/narration.txt
          cp ci/narration.txt voice/
      - name: Push to the voice branch
        run: |
          cd voice
          git init -q -b voice
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git add -A; git commit -qm "voice ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" voice
